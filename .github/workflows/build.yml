name: Build and verify Hoop Land Mod Loader

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify content-pack tooling
        run: |
          bash tests/verify_samples.sh
          python3 tools/hlmod.py pack samples/ContentPackMod --output "$RUNNER_TEMP/ContentPackMod.hlmod"
          python3 tools/hlmod.py validate "$RUNNER_TEMP/ContentPackMod.hlmod"
      - name: Restore and build
        run: |
          dotnet restore HoopLand.ModLoader.sln
          dotnet build HoopLand.ModLoader.sln --configuration Release --no-restore
      - name: Upload framework assemblies
        uses: actions/upload-artifact@v4
        with:
          name: HoopLand-ModLoader-build
          path: src/**/bin/Release/**
          if-no-files-found: error
          retention-days: 14
